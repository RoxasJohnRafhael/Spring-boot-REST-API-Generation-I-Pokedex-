<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Change Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap');
        body {
            font-family: 'Ubuntu', sans-serif;
            background: radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.18) 0%, rgba(0, 0, 0, 0) 55%),
                        radial-gradient(circle at 90% 30%, rgba(255, 77, 45, 0.12) 0%, rgba(0, 0, 0, 0) 55%),
                        linear-gradient(135deg, #0b0b0f 0%, #1a1a1a 40%, #0b0b0f 100%);
            overflow-x: hidden;
        }
        .pokedex-glow {
            box-shadow: 0 30px 80px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.08) inset;
        }
        .pokeball-watermark {
            background:
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.14) 0 10px, rgba(255,255,255,0.0) 11px 100%),
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08) 0 45px, rgba(255,255,255,0) 46px 100%),
                linear-gradient(180deg, rgba(0,0,0,0) 0 48%, rgba(255,255,255,0.12) 49% 51%, rgba(0,0,0,0) 52% 100%),
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.12) 0 110px, rgba(255,255,255,0) 111px 100%);
        }
        .sprite-float {
            animation: floaty 4.8s ease-in-out infinite;
            filter: drop-shadow(0 14px 30px rgba(0,0,0,0.5));
        }
        @keyframes floaty {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .input-dark {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        .input-dark::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-5xl">
        <div class="grid grid-cols-1 md:grid-cols-2 rounded-3xl overflow-hidden pokedex-glow border border-white/10 bg-black/30 backdrop-blur-xl">
            <div class="relative p-10 bg-gradient-to-br from-emerald-500 via-emerald-600 to-emerald-900 text-white">
                <div class="absolute -top-24 -left-24 w-[420px] h-[420px] rounded-full opacity-25 pokeball-watermark"></div>
                <div class="absolute -bottom-28 -right-24 w-[480px] h-[480px] rounded-full opacity-15 pokeball-watermark"></div>

                <div class="relative">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-2xl bg-white/15 border border-white/20 flex items-center justify-center">
                            <i class="fas fa-shield-halved text-white text-xl"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[10px] uppercase font-black tracking-[6px] opacity-80">Security Console</span>
                            <span class="text-3xl font-black uppercase tracking-widest">Change Password</span>
                        </div>
                    </div>

                    <div class="mt-6 text-white/85 text-sm leading-relaxed">
                        Update your credentials to keep your Pokédex account protected.
                    </div>

                    <div class="mt-10 grid grid-cols-3 gap-4 items-end">
                        <div class="bg-white/10 border border-white/15 rounded-2xl p-4 text-center">
                            <img class="mx-auto w-20 h-20 object-contain sprite-float" src="https://s3.pokeos.com/pokeos-uploads/assets/pokemon/home/animated/280.gif" alt="Ralts" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/280.png'">
                            <div class="mt-3 text-[10px] uppercase font-black tracking-[4px] opacity-90">Ralts</div>
                        </div>
                        <div class="bg-white/10 border border-white/15 rounded-2xl p-4 text-center">
                            <img class="mx-auto w-20 h-20 object-contain sprite-float" style="animation-delay: .25s" src="https://s3.pokeos.com/pokeos-uploads/assets/pokemon/home/animated/448.gif" alt="Lucario" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/448.png'">
                            <div class="mt-3 text-[10px] uppercase font-black tracking-[4px] opacity-90">Lucario</div>
                        </div>
                        <div class="bg-white/10 border border-white/15 rounded-2xl p-4 text-center">
                            <img class="mx-auto w-20 h-20 object-contain sprite-float" style="animation-delay: .5s" src="https://s3.pokeos.com/pokeos-uploads/assets/pokemon/home/animated/700.gif" alt="Sylveon" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/700.png'">
                            <div class="mt-3 text-[10px] uppercase font-black tracking-[4px] opacity-90">Sylveon</div>
                        </div>
                    </div>

                    <div class="mt-8 flex flex-wrap gap-2">
                        <span class="px-3 py-1 rounded-full bg-black/20 border border-white/15 text-[10px] font-black uppercase tracking-[3px]">Secure</span>
                        <span class="px-3 py-1 rounded-full bg-black/20 border border-white/15 text-[10px] font-black uppercase tracking-[3px]">Encrypted</span>
                        <span class="px-3 py-1 rounded-full bg-black/20 border border-white/15 text-[10px] font-black uppercase tracking-[3px]">Trainer Only</span>
                    </div>
                </div>
            </div>

            <div class="p-10 bg-[#0f0f13]">
                <div class="flex items-center justify-between">
                    <div class="flex flex-col">
                        <span class="text-[10px] uppercase font-black tracking-[6px] text-white/40">Credentials</span>
                        <h1 class="text-2xl font-black uppercase tracking-widest text-white">Update Access</h1>
                    </div>
                    <div class="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-white/70">
                        <i class="fas fa-key"></i>
                    </div>
                </div>

                <div th:if="${error}" class="mt-6 bg-red-500/10 border border-red-500/30 text-red-200 px-4 py-3 rounded-2xl" role="alert">
                    <div class="flex items-start gap-3">
                        <i class="fas fa-triangle-exclamation mt-0.5"></i>
                        <p th:text="${error}" class="text-sm font-medium"></p>
                    </div>
                </div>

                <div th:if="${message}" class="mt-6 bg-emerald-500/10 border border-emerald-500/25 text-emerald-200 px-4 py-3 rounded-2xl" role="alert">
                    <div class="flex items-start gap-3">
                        <i class="fas fa-circle-check mt-0.5"></i>
                        <p th:text="${message}" class="text-sm font-medium"></p>
                    </div>
                </div>

                <form id="changePwForm" th:action="@{/change-password}" method="post" class="mt-8 space-y-5">
                    <div>
                        <label for="oldPassword" class="block text-[10px] font-black uppercase tracking-[4px] text-white/45 ml-2">Current Password</label>
                        <div class="mt-2 relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-white/40">
                                <i class="fas fa-lock"></i>
                            </div>
                            <input type="password" name="oldPassword" id="oldPassword" required
                                   class="input-dark block w-full pl-11 pr-4 py-3 rounded-2xl outline-none focus:ring-1 focus:ring-emerald-400 focus:border-emerald-400 text-sm font-bold"
                                   placeholder="••••••••">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="newPassword" class="block text-[10px] font-black uppercase tracking-[4px] text-white/45 ml-2">New Password</label>
                            <div class="mt-2 relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-white/40">
                                    <i class="fas fa-key"></i>
                                </div>
                                <input type="password" name="newPassword" id="newPassword" required
                                       class="input-dark block w-full pl-11 pr-4 py-3 rounded-2xl outline-none focus:ring-1 focus:ring-emerald-400 focus:border-emerald-400 text-sm font-bold"
                                       placeholder="••••••••">
                            </div>
                        </div>

                        <div>
                            <label for="confirmPassword" class="block text-[10px] font-black uppercase tracking-[4px] text-white/45 ml-2">Confirm New</label>
                            <div class="mt-2 relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-white/40">
                                    <i class="fas fa-shield-halved"></i>
                                </div>
                                <input type="password" name="confirmPassword" id="confirmPassword" required
                                       class="input-dark block w-full pl-11 pr-4 py-3 rounded-2xl outline-none focus:ring-1 focus:ring-emerald-400 focus:border-emerald-400 text-sm font-bold"
                                       placeholder="••••••••">
                            </div>
                        </div>
                    </div>

                    <div id="pwMismatch" class="hidden bg-yellow-500/10 border border-yellow-500/30 text-yellow-200 px-4 py-3 rounded-2xl">
                        <div class="flex items-start gap-3">
                            <i class="fas fa-circle-exclamation mt-0.5"></i>
                            <p class="text-sm font-medium">Passwords do not match.</p>
                        </div>
                    </div>

                    <button type="submit" id="changePwBtn"
                            class="w-full mt-2 bg-emerald-600 hover:bg-emerald-500 text-white py-4 rounded-2xl font-black uppercase tracking-[4px] shadow-lg shadow-emerald-900/20 transition-all hover:scale-[1.01] active:scale-[0.98]">
                        Update Password
                    </button>
                </form>

                <div class="mt-8 flex items-center justify-between">
                    <a th:href="@{/}" class="text-white/35 hover:text-white/70 text-xs font-black uppercase tracking-[4px]">Back</a>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="text-white/35 hover:text-white/70 text-xs font-black uppercase tracking-[4px]">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const mismatch = document.getElementById('pwMismatch');
        const btn = document.getElementById('changePwBtn');
        const form = document.getElementById('changePwForm');

        function syncPasswordState() {
            const p = newPassword.value || '';
            const c = confirmPassword.value || '';
            const ok = p.length > 0 && c.length > 0 && p === c;
            mismatch.classList.toggle('hidden', ok || c.length === 0);
            btn.disabled = !ok;
            btn.classList.toggle('opacity-60', !ok);
            btn.classList.toggle('cursor-not-allowed', !ok);
        }

        newPassword.addEventListener('input', syncPasswordState);
        confirmPassword.addEventListener('input', syncPasswordState);
        form.addEventListener('submit', (e) => {
            syncPasswordState();
            if (btn.disabled) e.preventDefault();
        });

        syncPasswordState();
    </script>
</body>
</html>
